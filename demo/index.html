<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hand demo</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        background: #f4efe6;
        color: #1f1a17;
        font: 16px/1.45 ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 720px; margin: 0 auto; padding: 28px 20px 80px; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p { margin: 0 0 12px; }
      button, input {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        background: #fff;
        box-shadow: inset 0 0 0 1px #d6d3d1;
      }
      button.primary {
        background: #1f1a17;
        color: #fff;
        min-width: 280px;
        min-height: 64px;
        font-size: 18px;
        box-shadow: none;
      }
      input {
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #d6d3d1;
        background: #fff;
        min-width: 220px;
      }
      form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 8px 0 12px; }
      label { display: block; font-weight: 650; margin-bottom: 6px; }
      iframe { width: 100%; height: 132px; border: 1px solid #d6d3d1; border-radius: 10px; background: #e7eef8; }
      #count, #hello { font-weight: 650; }
      .spacer { height: 1100px; }
      .muted { color: #57534e; }
    </style>
  </head>
  <body>
    <main>
      <h1>Agent Hand demo</h1>
      <p class="muted">This page counts a click only when the event is trusted. A content-script <code>element.click()</code> does not count. The debugger does.</p>
      <p><button id="tick" class="primary" type="button">Count trusted clicks</button></p>
      <p id="count">Trusted clicks: 0</p>
      <p><button id="fake" type="button">Dispatch a script click</button></p>
      <p id="log" class="muted">No click yet.</p>
      <form id="name-form">
        <div>
          <label for="name">Your name</label>
          <input id="name" name="name" autocomplete="off" placeholder="Your name" />
        </div>
        <button type="submit">Save name</button>
      </form>
      <p id="hello">No name yet</p>
      <iframe title="Inner page" src="/demo/iframe.html"></iframe>
      <div class="spacer"></div>
      <p><button id="buried" type="button">Buried button</button></p>
      <p id="buried-count">Buried trusted clicks: 0</p>
    </main>
    <script>
      const tick = document.getElementById('tick');
      const count = document.getElementById('count');
      const log = document.getElementById('log');
      let n = 0;
      tick.addEventListener('click', (event) => {
        if (!event.isTrusted) {
          log.textContent = 'Untrusted click ignored.';
          return;
        }
        n += 1;
        count.textContent = 'Trusted clicks: ' + n;
        log.textContent = 'Trusted click accepted.';
      });
      document.getElementById('fake').addEventListener('click', (event) => {
        if (!event.isTrusted) return;
        tick.click();
      });
      document.getElementById('name-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const value = document.getElementById('name').value;
        const trust = event.isTrusted ? 'trusted' : 'untrusted';
        document.getElementById('hello').textContent = 'Hello, ' + value + ' (' + trust + ' submit)';
      });
      let buried = 0;
      document.getElementById('buried').addEventListener('click', (event) => {
        if (!event.isTrusted) return;
        buried += 1;
        document.getElementById('buried-count').textContent = 'Buried trusted clicks: ' + buried;
      });
    </script>
  </body>
</html>
